name: ZZER pipeline checks

on:
  pull_request:
    paths:
      - "src/**"
      - "supabase/functions/zzer-track-ingest/**"
      - "supabase/migrations/**"
      - "extension/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/zzer-pipeline.yml"
  push:
    branches:
      - main
      - "chatgpt/zzer-full-detail-ingest"
    paths:
      - "src/**"
      - "supabase/functions/zzer-track-ingest/**"
      - "supabase/migrations/**"
      - "extension/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/zzer-pipeline.yml"

jobs:
  zzer-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run ZZER scraper tests
        run: bun run test:zzer

      - name: Check extension JavaScript syntax
        run: node --check extension/background.js

      - name: Validate extension manifest JSON
        run: node --input-type=module -e "import { readFileSync } from 'node:fs'; JSON.parse(readFileSync('extension/manifest.json', 'utf8'));"
